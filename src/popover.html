<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src https: data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
  :root {
    --text: #1d1d1f;
    --muted: #6e6e73;
    --track: rgba(0, 0, 0, 0.12);
    --fill: rgba(0, 0, 0, 0.55);
    --card: rgba(255, 255, 255, 0.38);
    --chip: rgba(255, 255, 255, 0.55);
    --hover: rgba(0, 0, 0, 0.05);
    --accent: #fa2d48;
    --play-bg: rgba(255, 255, 255, 0.85);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --text: #f5f5f7;
      --muted: #a1a1a6;
      --track: rgba(255, 255, 255, 0.18);
      --fill: rgba(255, 255, 255, 0.75);
      --card: rgba(255, 255, 255, 0.08);
      --chip: rgba(255, 255, 255, 0.12);
      --hover: rgba(255, 255, 255, 0.07);
      --play-bg: rgba(255, 255, 255, 0.16);
    }
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: transparent; }
  body {
    font: 13px -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    color: var(--text);
    padding: 10px 16px 16px;
    display: flex; flex-direction: column;
    user-select: none; -webkit-user-select: none; cursor: default;
    overflow: hidden;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; display: grid; place-items: center; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
  svg { width: 100%; height: 100%; }
  .handle { width: 36px; height: 5px; border-radius: 3px; background: var(--track); margin: 0 auto 6px; }
  .top { display: flex; justify-content: flex-end; height: 30px; position: relative; }
  .gear { width: 30px; height: 30px; border-radius: 50%; background: var(--chip); padding: 7px; color: var(--muted); }
  .menu { position: absolute; top: 36px; right: 0; z-index: 2; min-width: 210px; padding: 5px; border-radius: 10px;
    background: var(--play-bg); backdrop-filter: blur(20px); box-shadow: 0 8px 30px rgba(0,0,0,.2); display: none; }
  .menu.open { display: block; }
  .menu button { width: 100%; display: flex; gap: 4px; justify-content: start; padding: 6px 10px; border-radius: 6px; }
  .menu button:hover { background: var(--accent); color: #fff; }

  .now { display: flex; gap: 16px; align-items: center; margin-top: 2px; }
  .art { width: 132px; height: 132px; border-radius: 12px; flex: none; object-fit: cover;
    background: linear-gradient(135deg, #8e9eab, #c9d6df); box-shadow: 0 8px 24px rgba(0,0,0,.18); }
  .meta { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .title { font-size: 16px; font-weight: 600; }
  .artist { font-size: 14px; color: var(--muted); }
  .album { font-size: 13px; color: var(--muted); }
  .title, .artist, .album { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  input[type=range] { -webkit-appearance: none; width: 100%; height: 4px; border-radius: 2px; margin: 0;
    background: linear-gradient(to right, var(--fill) var(--p, 0%), var(--track) var(--p, 0%)); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%;
    background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.35); }
  .vol input[type=range]::-webkit-slider-thumb { width: 22px; height: 22px; }
  input.seek { margin-top: 22px; }
  .times { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; margin-top: 8px; font-variant-numeric: tabular-nums; }

  .controls { display: flex; align-items: center; justify-content: space-between; margin: 14px 4px 0; }
  .small { width: 30px; height: 30px; padding: 5px; color: var(--muted); border-radius: 8px; position: relative; }
  .small.on { color: var(--accent); }
  .small .badge { position: absolute; right: 1px; bottom: 1px; font-size: 9px; font-weight: 700; }
  .skip { width: 44px; height: 44px; padding: 8px; }
  .play { width: 64px; height: 64px; border-radius: 50%; padding: 18px; background: var(--play-bg); box-shadow: 0 4px 16px rgba(0,0,0,.12); }
  .skip:active, .play:active { transform: scale(.94); }

  .vol { display: flex; align-items: center; gap: 12px; margin-top: 18px; color: var(--muted); }
  .vol .icon { width: 20px; height: 20px; flex: none; }

  .queue { margin-top: 20px; background: var(--card); border-radius: 14px; padding: 12px 6px 6px; flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .tabs { display: flex; gap: 4px; padding: 0 6px 8px; }
  .tabs button { font-size: 14px; font-weight: 600; color: var(--muted); padding: 2px 6px; border-radius: 6px; }
  .tabs button.on { color: var(--text); }
  .list[hidden] { display: none; }
  .list { overflow-y: auto; flex: 1; min-height: 0; }
  .row { width: 100%; display: flex; gap: 12px; align-items: center; padding: 6px 10px; border-radius: 8px; text-align: left; justify-content: start; }
  .row:hover { background: var(--hover); }
  .row .ph { display: grid; place-items: center; color: rgba(255,255,255,.85); font-size: 18px; }
  .row img, .row .ph { width: 44px; height: 44px; border-radius: 6px; flex: none; object-fit: cover; background: linear-gradient(135deg, #8e9eab, #c9d6df); }
  .row .txt { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .row .t { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .a { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .empty { color: var(--muted); padding: 8px 10px; }
  .section { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); padding: 10px 10px 4px; }
  .hint { font-size: 11px; color: var(--muted); padding: 8px 10px 4px; line-height: 1.4; }

  .setup { display: none; flex-direction: column; gap: 12px; margin-top: 8px; background: var(--card); border-radius: 14px; padding: 18px; }
  .setup h2 { font-size: 16px; font-weight: 600; }
  .setup p, .setup li { color: var(--muted); line-height: 1.5; }
  .setup ol { padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
  .setup b { color: var(--text); font-weight: 600; }
  .setup .cta { background: var(--accent); color: #fff; border-radius: 8px; padding: 8px 12px; font-weight: 600; justify-self: start; display: inline-grid; align-self: start; }
  .player { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  body.err .player { display: none; }
  body.err .setup { display: flex; }
</style>
</head>
<body>
  <div class="handle"></div>
  <div class="top">
    <button class="gear" id="gear" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M12 5a7 7 0 1 1 0 14 7 7 0 0 1 0-14zm0 4.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z"/><g id="tooth"><rect x="10.4" y="1.5" width="3.2" height="5" rx="1"/></g><use href="#tooth" transform="rotate(45 12 12)"/><use href="#tooth" transform="rotate(90 12 12)"/><use href="#tooth" transform="rotate(135 12 12)"/><use href="#tooth" transform="rotate(180 12 12)"/><use href="#tooth" transform="rotate(225 12 12)"/><use href="#tooth" transform="rotate(270 12 12)"/><use href="#tooth" transform="rotate(315 12 12)"/></svg>
    </button>
    <div class="menu" id="menu">
      <button data-cmd="open">Open YouTube Music in Vivaldi</button>
      <button id="login" role="menuitemcheckbox" aria-checked="false"><span id="loginCheck" style="width:16px">&nbsp;</span>Open at Login</button>
      <button data-cmd="quit">Quit</button>
    </div>
  </div>

  <div class="player">
    <div class="now">
      <img class="art" id="art" alt="">
      <div class="meta">
        <div class="title" id="title">Nothing playing</div>
        <div class="artist" id="artist"></div>
        <div class="album" id="album"></div>
      </div>
    </div>

    <input class="seek" id="seek" type="range" min="0" max="0" step="0.1" value="0" aria-label="Seek">
    <div class="times"><span id="elapsed">0:00</span><span id="remaining">-0:00</span></div>

    <div class="controls">
      <button class="small" id="shuffle" data-cmd="shuffle" aria-label="Shuffle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h3c2.2 0 3.3 1.2 4.7 3.6l2.6 4.6C14.7 17.6 15.8 17 18 17h3M3 17h3c1.5 0 2.5-.6 3.4-1.8M14.6 8.8C15.5 7.6 16.5 7 18 7h3M18 4l3 3-3 3M18 14l3 3-3 3"/></svg>
      </button>
      <button class="skip" data-cmd="prev" aria-label="Previous">
        <svg viewBox="0 0 24 24" fill="currentColor" style="transform:scaleX(-1)"><path d="M2 6.6v10.8a.9.9 0 0 0 1.4.75L11 13.1v4.3a.9.9 0 0 0 1.4.75l8.6-5.4a.9.9 0 0 0 0-1.5l-8.6-5.4a.9.9 0 0 0-1.4.75v4.3L3.4 5.85A.9.9 0 0 0 2 6.6z"/></svg>
      </button>
      <button class="play" id="play" data-cmd="play" aria-label="Play">
        <svg viewBox="0 0 24 24" fill="currentColor" id="playIcon"></svg>
      </button>
      <button class="skip" data-cmd="next" aria-label="Next">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 6.6v10.8a.9.9 0 0 0 1.4.75L11 13.1v4.3a.9.9 0 0 0 1.4.75l8.6-5.4a.9.9 0 0 0 0-1.5l-8.6-5.4a.9.9 0 0 0-1.4.75v4.3L3.4 5.85A.9.9 0 0 0 2 6.6z"/></svg>
      </button>
      <button class="small" id="repeat" data-cmd="repeat" aria-label="Repeat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12V9.5A3.5 3.5 0 0 1 7.5 6H20M17 3l3 3-3 3M20 12v2.5a3.5 3.5 0 0 1-3.5 3.5H4M7 21l-3-3 3-3"/></svg>
        <span class="badge" id="repeatOne" hidden>1</span>
      </button>
    </div>

    <div class="vol">
      <span class="icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9h3.5L12 5v14l-4.5-4H4z"/></svg></span>
      <input id="volume" type="range" min="0" max="100" step="1" value="50" aria-label="Volume">
      <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9h3.5L12 5v14l-4.5-4H4z" fill="currentColor" stroke="none"/><path d="M15.5 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/></svg></span>
    </div>

    <div class="queue">
      <div class="tabs" role="tablist">
        <button class="on" id="tabQueue" role="tab" aria-selected="true">Up Next</button>
        <button id="tabLists" role="tab" aria-selected="false">Playlists</button>
      </div>
      <div class="list" id="list"></div>
      <div class="list" id="lists" hidden></div>
    </div>
  </div>

  <div class="setup" id="setup"></div>

<script>
  const send = m => window.ipc.postMessage(m);
  const $ = id => document.getElementById(id);
  const PLAY = '<path d="M7 4.8v14.4a1 1 0 0 0 1.5.86l12-7.2a1 1 0 0 0 0-1.72l-12-7.2A1 1 0 0 0 7 4.8z"/>';
  const PAUSE = '<rect x="5" y="4" width="5" height="16" rx="1.3"/><rect x="14" y="4" width="5" height="16" rx="1.3"/>';

  const SETUP = {
    js_off: {
      title: 'Izinkan JavaScript dari Apple Events',
      body: '<p>Popover ini mengontrol tab YouTube Music di Vivaldi. Vivaldi perlu mengizinkannya sekali:</p>' +
        '<ol><li>Buka <b>Vivaldi</b>, tekan <b>⌘ ,</b> untuk Settings.</li>' +
        '<li>Pilih <b>Privacy</b>.</li>' +
        '<li>Di bagian <b>Apple Events</b>, aktifkan <b>Allow JavaScript from Apple Events</b>.</li></ol>' +
        '<p>Popover tersambung otomatis setelah diaktifkan.</p>',
    },
    automation: {
      title: 'Izinkan kontrol Vivaldi',
      body: '<p>macOS memblokir akses ke Vivaldi.</p>' +
        '<ol><li>Buka <b>System Settings › Privacy &amp; Security › Automation</b>.</li>' +
        '<li>Cari <b>yt-music</b> (atau <b>Terminal</b> kalau app dijalankan dari terminal).</li>' +
        '<li>Aktifkan <b>Vivaldi</b>.</li></ol>',
      cta: ['automation', 'Buka pengaturan Automation'],
    },
    no_tab: {
      title: 'Belum ada tab YouTube Music',
      body: '<p>Buka <b>music.youtube.com</b> di Vivaldi lalu putar lagu atau playlist. Login Vivaldi kamu langsung dipakai.</p>',
      cta: ['open', 'Buka YouTube Music'],
    },
  };

  let s = null, at = 0, seeking = false, volHoldUntil = 0, queueSig = '', listsSig = '';

  const fmt = sec => { sec = Math.max(0, Math.floor(sec || 0)); return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); };
  const paint = el => el.style.setProperty('--p', (el.max > 0 ? (el.value - el.min) / (el.max - el.min) * 100 : 0) + '%');
  const setText = (id, v) => { if ($(id).textContent !== v) $(id).textContent = v; };

  function renderSetup(n) {
    const c = SETUP[n.error] || { title: 'Tidak bisa tersambung ke Vivaldi', body: '' };
    const box = $('setup');
    box.innerHTML = '<h2></h2>' + c.body;
    box.querySelector('h2').textContent = c.title;
    if (!SETUP[n.error] && n.message) { const p = document.createElement('p'); p.textContent = n.message; box.append(p); }
    if (c.cta) { const b = document.createElement('button'); b.className = 'cta'; b.dataset.cmd = c.cta[0]; b.textContent = c.cta[1]; box.append(b); }
  }

  // rows: [{cmd, title, sub, img?, glyph}]; text only via textContent (titles come from YouTube).
  function renderRows(list, rows, emptyText) {
    list.replaceChildren();
    if (!rows.length) { const e = document.createElement('div'); e.className = 'empty'; e.textContent = emptyText; list.append(e); return; }
    for (const it of rows) {
      if (it.section) { const h = document.createElement('div'); h.className = 'section'; h.textContent = it.section; list.append(h); continue; }
      if (it.hint) { const h = document.createElement('div'); h.className = 'hint'; h.textContent = it.hint; list.append(h); continue; }
      const row = document.createElement('button');
      row.className = 'row';
      row.dataset.cmd = it.cmd;
      let thumb;
      if (it.img) { thumb = document.createElement('img'); thumb.src = it.img; thumb.alt = ''; }
      else { thumb = document.createElement('div'); thumb.className = 'ph'; thumb.textContent = it.glyph; }
      const txt = document.createElement('div'); txt.className = 'txt';
      const t = document.createElement('div'); t.className = 't'; t.textContent = it.title;
      const a = document.createElement('div'); a.className = 'a'; a.textContent = it.sub;
      txt.append(t, a); row.append(thumb, txt); list.append(row);
    }
  }

  function renderQueue(q) {
    const sig = JSON.stringify(q);
    if (sig === queueSig) return;
    queueSig = sig;
    renderRows($('list'), q.map(it => ({ cmd: 'playAt:' + it.i, title: it.title, sub: it.artist, img: it.img, glyph: '♪' })), 'Queue is empty');
  }

  function renderPlaylists(ls) {
    const sig = JSON.stringify(ls);
    if (sig === listsSig) return;
    listsSig = sig;
    const rows = [];
    let section = null;
    for (const p of ls) {
      if (p.section !== section) { section = p.section; rows.push({ section }); }
      rows.push({ cmd: 'playlist:' + p.i, title: p.title, sub: p.sub, img: p.img, glyph: '♫' });
    }
    if (!ls.some(p => p.section !== 'Library')) rows.push({ hint: 'Recommended playlists appear here while the YouTube Music tab shows Home.' });
    renderRows($('lists'), rows, 'No playlists found');
  }

  function showTab(lists) {
    $('list').hidden = lists; $('lists').hidden = !lists;
    $('tabQueue').classList.toggle('on', !lists); $('tabLists').classList.toggle('on', lists);
    $('tabQueue').setAttribute('aria-selected', !lists); $('tabLists').setAttribute('aria-selected', lists);
  }

  function renderControls() {
    $('playIcon').innerHTML = s.paused ? PLAY : PAUSE;
    $('play').setAttribute('aria-label', s.paused ? 'Play' : 'Pause');
    $('shuffle').classList.toggle('on', s.shuffle);
    $('repeat').classList.toggle('on', s.repeat !== 'off');
    $('repeatOne').hidden = s.repeat !== 'one';
  }

  // Called from Rust with whether the login item is installed.
  window.setLogin = on => { $('login').setAttribute('aria-checked', on); $('loginCheck').textContent = on ? '✓' : '\u00a0'; };

  // Called from Rust with the tab's state as a JSON string.
  window.update = raw => {
    const n = JSON.parse(raw);
    document.body.classList.toggle('err', !!n.error);
    if (n.error) { renderSetup(n); return; }
    s = n; at = performance.now();
    setText('title', s.title || 'Nothing playing');
    setText('artist', s.artist);
    setText('album', s.album);
    if (s.art && $('art').getAttribute('src') !== s.art) $('art').src = s.art;
    if (!s.art) $('art').removeAttribute('src');
    $('seek').max = s.d || 0;
    if (performance.now() > volHoldUntil) { $('volume').value = s.vol; paint($('volume')); }
    renderControls();
    renderQueue(s.queue);
    renderPlaylists(s.playlists || []);
  };

  // Interpolate progress between 1s polls.
  (function tick() {
    if (s && !seeking) {
      const t = s.paused ? s.t : Math.min(s.d, s.t + (performance.now() - at) / 1000);
      $('seek').value = t; paint($('seek'));
      setText('elapsed', fmt(t)); setText('remaining', '-' + fmt(s.d - t));
    }
    requestAnimationFrame(tick);
  })();

  $('seek').addEventListener('input', e => {
    seeking = true; paint(e.target);
    setText('elapsed', fmt(+e.target.value)); setText('remaining', '-' + fmt((s?.d || 0) - e.target.value));
  });
  $('seek').addEventListener('change', e => {
    send('seek:' + e.target.value);
    if (s) { s.t = +e.target.value; at = performance.now(); }
    seeking = false;
  });

  let volTimer = null;
  $('volume').addEventListener('input', e => {
    paint(e.target); volHoldUntil = performance.now() + 1500;
    if (!volTimer) volTimer = setTimeout(() => { volTimer = null; send('volume:' + $('volume').value); }, 80);
  });
  $('volume').addEventListener('change', e => { volHoldUntil = performance.now() + 1500; send('volume:' + e.target.value); });

  document.addEventListener('click', e => {
    if (e.target.closest('#gear')) { $('menu').classList.toggle('open'); return; }
    if (e.target.closest('#login')) { const on = $('login').getAttribute('aria-checked') !== 'true'; window.setLogin(on); send('login:' + (on ? 1 : 0)); return; }
    if (e.target.closest('#tabQueue')) { showTab(false); return; }
    if (e.target.closest('#tabLists')) { showTab(true); return; }
    $('menu').classList.remove('open');
    const b = e.target.closest('[data-cmd]');
    if (!b) return;
    const cmd = b.dataset.cmd;
    // Optimistic UI so clicks feel instant; next poll corrects it.
    if (s && cmd === 'play') { s.t = +$('seek').value; at = performance.now(); s.paused = !s.paused; renderControls(); }
    if (s && cmd === 'shuffle') { s.shuffle = !s.shuffle; renderControls(); }
    if (s && cmd === 'repeat') { s.repeat = { off: 'all', all: 'one', one: 'off' }[s.repeat]; renderControls(); }
    send(cmd);
    // Starting a playlist replaces the queue; show it.
    if (cmd.startsWith('playlist:')) showTab(false);
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') send('hide');
    if (e.key === ' ' && !e.target.closest('input')) { e.preventDefault(); $('play').click(); }
  });

  $('playIcon').innerHTML = PLAY;
  paint($('volume'));
</script>
</body>
</html>
